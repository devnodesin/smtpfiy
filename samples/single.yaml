# smtpfiy single-file configuration.
# Everything (server + domains) in one file.
server:
  host: "127.0.0.1"
  port: 7001
  smtp_host: "127.0.0.1"
  smtp_port: 2525
  db_path: "/smtpfiy/data/smtpfiy.db"
  scheduler: order
  retry: 1
  retry_delay: 60
  log_level: info
  log_file: "/smtpfiy/log/smtpfiy.log"
  # Optional SMTP AUTH (PLAIN/LOGIN). Omit or leave users empty for a fully
  # unauthenticated listener (default, backward compatible). When at least one
  # user is configured, the EHLO response advertises "AUTH PLAIN LOGIN".
  # smtp_auth:
  #   required: false   # if true, reject MAIL FROM before AUTH with 530
  #   users:
  #     - username: "resend"
  #       password: "changeme"
  #
  # Optional STARTTLS. Omit or set enabled: false for a plaintext listener
  # (default, backward compatible). When enabled: true, AUTH (and MAIL FROM when
  # smtp_auth.required) require an encrypted session. With empty cert_file and
  # key_file an in-memory self-signed cert is generated each start.
  # smtp_tls:
  #   enabled: false
  #   cert_file: ""     # PEM cert path; empty + enabled => self-signed generated
  #   key_file: ""      # PEM key path; empty + enabled => self-signed generated

domains:
  example.com:
    providers:
      # Primary provider (Resend).
      - provider: resend
        api_key: "re_your_api_key_here"
        limit_daily: 100
        limit_monthly: 3000
      # Optional fallback provider for the same sender domain (Brevo). With
      # scheduler "order" Resend is tried first, then Brevo. Commented out:
      # replace the placeholder api_key before use to avoid live API calls.
      # - provider: brevo
      #   api_key: "brevo_your_api_key_here"
      #   limit_daily: 100
      #   limit_monthly: 3000
