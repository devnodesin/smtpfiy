# smtpfiy multi-file configuration (part 2 of 2): domains and providers.
# Combine with multi-main.yaml using:
#   smtpfiy -c samples/multi-main.yaml,samples/multi-provider.yaml
domains:
  example.com:
    providers:
      # Primary provider (Resend).
      - provider: resend
        api_key: "re_your_api_key_here"
        limit_daily: 100
        limit_monthly: 3000
      # Fallback provider for the same sender domain (Brevo).
      - provider: brevo
        api_key: "brevo_your_api_key_here"
        limit_daily: 100
        limit_monthly: 3000
  alerts.example.com:
    providers:
      - provider: resend
        api_key: "re_your_api_key_here"
        limit_daily: 500
        limit_monthly: 15000
