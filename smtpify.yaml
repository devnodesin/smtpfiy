# smtpify multi-file configuration (part 1 of 2): server settings.
# Combine with multi-provider.yaml using:
#   smtpify -c samples/multi-main.yaml,samples/multi-provider.yaml
server:
  port: 7001
  smtp_port: 2525
  scheduler: rr
  retry: 0
  retry_delay: 30
  log_level: info
  log_file: "/smtpfiy/log/smtpfiy.log"
  db_path: "/smtpfiy/data/smtpfiy.db"
